# Specification for Li, Chan, Long (2009) Bell-state Arbitrated Quantum Signature scheme.
# Citation: Li, Chan, Long. Arbitrated quantum signature scheme using Bell states. PRA 79, 054307 (2009).
#
# Simpler Bell-state AQS scheme exhibiting the canonical five-procedure shape with fewer registers.

name: "li-chan-long-2009"
family: "teleportation-aqs"
encryption: "qotp"
n_message_qubits: 2
citation: "Li, Chan, Long. Arbitrated quantum signature scheme using Bell states. PRA 79, 054307 (2009)."

verifier_set:
  - "Bob"
  - "Trent"

keys:
  - name: "k_AT"
    bits: 4
    reuse_policy: "single-use"
  - name: "k_BT"
    bits: 4
    reuse_policy: "single-use"

registers:
  - name: "msg"
    qubits: 2
    owner: "Alice"
  - name: "sig"
    qubits: 2
    owner: "Alice"
  - name: "bell_pair"
    qubits: 4
    owner: "Trent"
  - name: "decoy_AT"
    qubits: 2
    owner: "Alice"
  - name: "decoy_TB"
    qubits: 2
    owner: "Trent"
  - name: "receipt"
    qubits: 2
    owner: "Bob"

steps:
  # INIT PROCEDURE
  - procedure: "INIT"
    party: "Trent"
    action: "prepare"
    registers: ["bell_pair"]
    keys_used: []
    decoy_protected: false
    name: "prepare_bell_states"
    detail:
      resource: "Bell pairs (|Phi+>)"

  - procedure: "INIT"
    party: "Trent"
    action: "send"
    registers: ["bell_pair", "decoy_AT", "decoy_TB"]
    keys_used: ["k_AT", "k_BT"]
    decoy_protected: true
    name: "distribute_bell_states_and_keys"
    detail:
      channel: "quantum"

  # SIGN PROCEDURE
  - procedure: "SIGN"
    party: "Alice"
    action: "prepare"
    registers: ["msg"]
    keys_used: []
    decoy_protected: false
    name: "prepare_message"
    detail: {}

  - procedure: "SIGN"
    party: "Alice"
    action: "apply"
    registers: ["msg", "sig"]
    keys_used: ["k_AT"]
    decoy_protected: false
    name: "encrypt_signature_qotp"
    detail:
      encryption: "qotp"

  - procedure: "SIGN"
    party: "Alice"
    action: "send"
    registers: ["sig", "msg", "decoy_AT"]
    keys_used: []
    decoy_protected: true
    name: "send_signature_to_trent"
    detail:
      channel: "quantum"

  # VERIFY PROCEDURE
  - procedure: "VERIFY"
    party: "Trent"
    action: "check"
    registers: ["decoy_AT"]
    keys_used: []
    decoy_protected: true
    name: "trent_check_decoys"
    detail:
      test: "decoy_parameter_estimation"

  - procedure: "VERIFY"
    party: "Trent"
    action: "measure"
    registers: ["sig", "msg", "bell_pair"]
    keys_used: ["k_AT"]
    decoy_protected: false
    name: "trent_verify_arbitration"
    detail:
      test: "bell_state_measurement"

  - procedure: "VERIFY"
    party: "Trent"
    action: "send"
    registers: ["sig", "msg", "decoy_TB"]
    keys_used: ["k_BT"]
    decoy_protected: true
    name: "trent_forward_to_bob"
    detail:
      channel: "quantum"

  - procedure: "VERIFY"
    party: "Bob"
    action: "check"
    registers: ["decoy_TB"]
    keys_used: []
    decoy_protected: true
    name: "bob_check_decoys"
    detail:
      test: "decoy_parameter_estimation"

  - procedure: "VERIFY"
    party: "Bob"
    action: "measure"
    registers: ["sig", "bell_pair"]
    keys_used: ["k_BT"]
    decoy_protected: false
    name: "bob_verify_signature"
    detail:
      test: "bell_correlation"

  - procedure: "VERIFY"
    party: "Bob"
    action: "accept"
    registers: ["msg"]
    keys_used: []
    decoy_protected: false
    name: "bob_accept_signature"
    detail: {}

  # PROOF_OF_ORIGIN PROCEDURE
  - procedure: "PROOF_OF_ORIGIN"
    party: "Trent"
    action: "publish"
    registers: ["sig"]
    keys_used: ["k_AT"]
    decoy_protected: false
    name: "trent_publish_origin_record"
    detail:
      claim: "non_repudiation_origin"

  - procedure: "PROOF_OF_ORIGIN"
    party: "Bob"
    action: "check"
    registers: ["sig"]
    keys_used: ["k_AT"]
    decoy_protected: false
    name: "bob_verify_origin_record"
    detail: {}

  # PROOF_OF_RECEIPT PROCEDURE
  - procedure: "PROOF_OF_RECEIPT"
    party: "Bob"
    action: "send"
    registers: ["receipt"]
    keys_used: ["k_BT"]
    decoy_protected: true
    name: "bob_send_receipt_ack"
    detail:
      claim: "non_repudiation_receipt"

  - procedure: "PROOF_OF_RECEIPT"
    party: "Alice"
    action: "check"
    registers: ["receipt"]
    keys_used: ["k_BT"]
    decoy_protected: false
    name: "alice_verify_receipt_ack"
    detail: {}

claims:
  - "unforgeability"
  - "non_repudiation_origin"
  - "non_repudiation_receipt"
  - "no_false_allegation"

assumed_fields:
  - "key length policy on reuse"
  - "dispute-resolution procedure detail"
  - "noiseless Bell state correlation fidelity assumption"
